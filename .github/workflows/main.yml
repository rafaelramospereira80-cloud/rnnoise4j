name: Build RNNoise ARM64
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.14.1
      - name: Compile librnnoise.so for Android ARM64
        run: |
          mkdir -p out
          find . -maxdepth 4 -name "*.c"
          zig cc -target aarch64-linux-android -shared -fPIC -O3 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            $(find . -path "./.git" -prune -o -type d \( -name "include" -o -name "src" -o -name "c" \) -print | sed 's/^/-I/') \
            $(find . -path "./.git" -prune -o -name "*.c" ! -name "*example*" ! -name "*dump*" ! -name "*test*" -print) \
            -o out/librnnoise.so -lm
      - uses: actions/upload-artifact@v4
        with:
          name: rnnoise-android-arm64
          path: out/librnnoise.so
