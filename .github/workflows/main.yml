name: Build RNNoise ARM64
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xiph/rnnoise
          path: rnnoise_src
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Compile librnnoise.so with Android NDK
        run: |
          sudo apt-get update && sudo apt-get install -y autoconf automake libtool
          export TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          cd rnnoise_src
          ./autogen.sh
          ./configure --host=aarch64-linux-android --disable-examples --disable-doc
          make -j4
          cd ..
          mkdir -p out
          $CC -shared -fPIC -O3 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -Inative/src -Irnnoise_src/include \
            native/src/*.c rnnoise_src/.libs/librnnoise.a \
            -o out/librnnoise.so -lm
      - uses: actions/upload-artifact@v4
        with:
          name: rnnoise-android-arm64
          path: out/librnnoise.so
