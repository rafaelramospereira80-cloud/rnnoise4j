name: Build RNNoise ARM64
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xiph/rnnoise
          path: rnnoise_src
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Patch JNI wrapper and compile librnnoise4j.so
        run: |
          sudo apt-get update && sudo apt-get install -y autoconf automake libtool
          export TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          cd rnnoise_src
          ./autogen.sh
          ./configure --host=aarch64-linux-android --disable-examples --disable-doc
          sed -i '/USE_WEIGHTS_FILE/d' config.h
          sed -i '/ENABLE_X86_RTCD/d' config.h
          cd ..
          sed -i 's/rnnoise_create(rnn_model)/rnnoise_create(NULL)/g' native/src/rnnoise.c
          sed -i 's/if (rnn_model == NULL)/if (0)/g' native/src/rnnoise.c
          mkdir -p out
          $CC -shared -fPIC -O3 -DRNNOISE_BUILD -DHAVE_CONFIG_H \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -Inative/include -Inative/src -Irnnoise_src -Irnnoise_src/include -Irnnoise_src/src \
            native/src/*.c \
            rnnoise_src/src/denoise.c \
            rnnoise_src/src/rnn.c \
            rnnoise_src/src/rnnoise_data.c \
            rnnoise_src/src/rnnoise_tables.c \
            rnnoise_src/src/nnet.c \
            rnnoise_src/src/nnet_default.c \
            rnnoise_src/src/parse_lpcnet_weights.c \
            rnnoise_src/src/pitch.c \
            rnnoise_src/src/kiss_fft.c \
            rnnoise_src/src/celt_lpc.c \
            -o out/librnnoise4j.so -lm
      - uses: actions/upload-artifact@v4
        with:
          name: rnnoise-android-arm64
          path: out/librnnoise4j.so
