name: Build RNNoise ARM64
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: sudo snap install zig --classic --beta
      - name: Compile librnnoise.so for Android ARM64
        run: |
          mkdir -p out
          zig cc -target aarch64-linux-android -shared -fPIC -O3 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -Isrc/main/c -Irnnoise/include -Irnnoise/src \
            $(find src/main/c rnnoise/src -name "*.c" ! -name "*example*" ! -name "*dump*") \
            -o out/librnnoise.so -lm
      - uses: actions/upload-artifact@v4
        with:
          name: rnnoise-android-arm64
          path: out/librnnoise.so
