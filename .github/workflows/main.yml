name: Build RNNoise ARM64
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Compile librnnoise.so with Android NDK
        run: |
          git clone --depth 1 https://xiph.org rnnoise_src || git clone --depth 1 https://github.com rnnoise_src
          mkdir -p out
          CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          $CC -shared -fPIC -O3 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -Inative/src -Irnnoise_src/include -Irnnoise_src/src \
            $(find native/src rnnoise_src/src -name "*.c" ! -name "*example*" ! -name "*dump*" ! -name "*test*" ! -name "*train*" ! -name "*nnet_data*") \
            -o out/librnnoise.so -lm
      - uses: actions/upload-artifact@v4
        with:
          name: rnnoise-android-arm64
          path: out/librnnoise.so
