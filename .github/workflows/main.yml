name: Build RNNoise ARM64
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xiph/rnnoise
          ref: 7f449bf8bd3b933891d12c30112268c4090e4d59
          path: rnnoise_src
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Compile librnnoise4j.so with Android NDK
        run: |
          mkdir -p out
          CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          $CC -shared -fPIC -O3 -DRNNOISE_BUILD \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -Inative/include -Inative/src -Irnnoise_src/include -Irnnoise_src/src \
            native/src/*.c \
            rnnoise_src/src/denoise.c \
            rnnoise_src/src/rnn.c \
            rnnoise_src/src/rnn_data.c \
            rnnoise_src/src/rnn_reader.c \
            rnnoise_src/src/pitch.c \
            rnnoise_src/src/kiss_fft.c \
            rnnoise_src/src/celt_lpc.c \
            -o out/librnnoise4j.so -lm
      - uses: actions/upload-artifact@v4
        with:
          name: rnnoise-android-arm64
          path: out/librnnoise4j.so
